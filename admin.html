<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDaSH Learning Hub - Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #005eb8; }
    .github-token-input { font-family: monospace; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-shield-lock-fill me-2"></i>RDaSH Hub Admin
    </a>
    <div class="d-flex text-white align-items-center">
      <span id="repoStatus" class="badge bg-secondary">Not Connected</span>
      <button class="btn btn-sm btn-outline-light ms-3" onclick="openSettings()">
        <i class="bi bi-gear-fill"></i> Settings
      </button>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row">
    <div class="col-lg-12">
      <!-- Alerts -->
      <div id="alertContainer"></div>

      <!-- Main Dashboard -->
      <div id="dashboard" class="d-none">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold">Course Classes List</h2>
          <button class="btn btn-primary" onclick="showAddForm()">
            <i class="bi bi-plus-lg me-1"></i> Add New Class
          </button>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Mode</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="classesTableBody">
                  <tr><td colspan="5" class="text-center py-4">Loading classes...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-0">
        <h5 class="modal-title fw-bold"><i class="bi bi-gear me-2"></i>GitHub Connection</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="small text-muted">To save updates to the main site, enter your GitHub Personal Access Token with repository write permissions.</p>
        <div class="mb-3">
          <label class="form-label fw-bold">GitHub Token</label>
          <input type="password" id="ghToken" class="form-control github-token-input" placeholder="github_pat_xxx...">
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-primary px-4" onclick="saveSettings()">Save Configuration</button>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Class Modal -->
<div class="modal fade" id="classModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header bg-light border-0">
        <h5 class="modal-title fw-bold" id="classModalTitle">Add New Class</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="classForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Course Title (Main Name)</label>
              <input type="text" class="form-control" id="f_Course" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Display Title</label>
              <input type="text" class="form-control" id="f_Title" required>
            </div>
            <div class="col-md-12">
              <label class="form-label">Offering Name (Usually Title + Details)</label>
              <input type="text" class="form-control" id="f_OfferingName">
            </div>
            <div class="col-md-4">
              <label class="form-label">Delivery Mode</label>
              <select class="form-select" id="f_Mode">
                <option value="Online">Online</option>
                <option value="Face to Face">Face to Face</option>
                <option value="Hybrid">Hybrid</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" id="f_StartDate" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control" id="f_EndDate" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Start Time</label>
              <input type="time" class="form-control" id="f_StartTime">
            </div>
            <div class="col-md-3">
              <label class="form-label">End Time</label>
              <input type="time" class="form-control" id="f_EndTime">
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <input type="text" class="form-control" id="f_Category" placeholder="e.g. Health & Wellbeing">
            </div>
            <div class="col-md-12">
              <label class="form-label">Booking / ESR Link</label>
              <input type="url" class="form-control" id="f_Link" placeholder="https://my.esr.nhs.uk...">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success px-4" onclick="saveClass()" id="btnSave">
          <i class="bi bi-cloud-arrow-up-fill me-1"></i> Save to GitHub
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
