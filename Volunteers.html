<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>RDaSH Volunteer Learning Hub</title>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<!-- Bootstrap 5 (only once) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"/>
<!-- FullCalendar CSS -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet"/>
<link href="style/style.css" rel="stylesheet"/>
</head>
<body>
<header class="nhs-header">
<div class="container">
<div class="row">
<h1 class="mb-0">RDaSH Learning Hub – Volunteers</h1>
</div>
<nav class="navbar navbar-expand-lg">
<div class="container px-0 d-flex align-items-center">
<div class="logo-container me-3" style="width: 100px;"> <img class="logo esr" src="Assets/LMHub_Logo.png"/>
<img class="logo nhs" src="Assets/LMHub_Logo.png"/>
</div>
<button aria-label="Toggle navigation menu" class="navbar-toggler" data-bs-target="#navMenu" data-bs-toggle="collapse" type="button">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse justify-content-center" id="navMenu">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" onclick="showPage('volunteers_home')">Home</a></li>
<li class="nav-item"><a class="nav-link" onclick="showPage('volunteers_FAQs')">FAQs</a></li>
<li class="nav-item"><a class="nav-link" href="index.html">RDaSH Learning Resource Hub</a></li>
<li class="nav-item"><a class="nav-link" onclick="showPage('volunteers_Support')">Support</a></li>
</ul>
</div>
<div class="d-none d-lg-block" style="width: 100px;"></div>
</div>
</nav>
<div class="container mt-3">
<div class="row align-items-center g-2">
<div class="col">
<input class="form-control" id="searchInput" onkeyup="searchPages()" placeholder="Search bar" type="text"/>
</div>
<div class="col-auto">
<div class="d-flex flex-wrap align-items-center gap-2 control-toolbar p-2 rounded">
<label class="visually-hidden" for="themeSelector">Choose Theme</label>
<select class="form-select form-select-sm w-auto" id="themeSelector">
<option value="blue">💙 NHS Blue</option>
<option value="green">💚 NHS Green</option>
<option value="calm">🩶 NHS Grey</option>
<option value="pink">💗 NHS Pink</option>
<option value="purple">💜 NHS Purple</option>
<option value="red">❤️ NHS Red</option>
<option value="yellow">💛 NHS Yellow</option>
<option value="contrast">⚠️ High Contrast</option>
</select>
<div aria-label="Text Size" class="btn-group btn-group-sm" role="group">
<button class="btn btn-outline-secondary" onclick="setTextSize('scale-small')">A–</button>
<button class="btn btn-outline-secondary" onclick="setTextSize('scale-medium')">A</button>
<button class="btn btn-outline-secondary" onclick="setTextSize('scale-large')">A+</button>
<button class="btn btn-outline-secondary" onclick="setTextSize('scale-xlarge')">A++</button>
</div>
</div>
</div>
</div>
</div>
</div>
</header>

=                     HOME PAGE SECTION                   =
========================================================= -->
<div id="content-container"></div>

  = FAQs SECTION =
  ========================================================= -->

<!-- Modal for class details -->
<div aria-hidden="true" aria-labelledby="classModalLabel" class="modal fade" id="classModal" tabindex="-1">
<div class="modal-dialog modal-lg modal-dialog-centered">
<div class="modal-content border-0 shadow-lg rounded-4">
<div class="modal-header border-0 pb-0">
<div class="d-flex align-items-center">
<div class="bg-primary bg-opacity-10 p-2 rounded-3 me-3">
<i class="bi bi-journal-text text-primary fs-4"></i>
</div>
<h5 class="modal-title fw-bold" id="classModalLabel">Class Details</h5>
</div>
<button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
</div>
<div class="modal-body p-4">
<div id="modalDetails">
</div>
</div>
<div class="modal-footer border-0 pt-0 px-4 pb-4 justify-content-between">
<button class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal" type="button">Close</button>
<a class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" href="#" id="modalLink" target="_blank">
            Go to Offering <i class="bi bi-box-arrow-up-right ms-1"></i>
</a>
</div>
</div>
</div>
</div>
<!-- JS libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script defer="" src="script/script.js"></script>

</script>
</body>
</html>
