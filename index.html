  <div id="Informal_Learning" class="page">
    <div class="container py-4">

      <div class="row mb-4">
        <div class="col">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb bg-light p-3 rounded-pill shadow-sm">
              <li class="breadcrumb-item">
                <a href="#" onclick="showPage('home');" class="text-decoration-none">
                  <i class="bi bi-house-door"></i> Hub
                </a>
              </li>
              <li class="breadcrumb-item active fw-bold" style="color: #20c997;" aria-current="page">Informal
                Learning
              </li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="row align-items-start mb-5">
        <div class="col-md-10">
          <h1 class="display-5 fw-bold text-dark">Informal Learning</h1>
          <p class="lead text-muted">Not all learning happens in a classroom. Discover opportunities for shadowing,
            coaching, and peer-to-peer growth.</p>
        </div>

        <div class="col-md-2 text-end d-none d-md-block mt-2">
          <div class="p-3 border-start border-4 rounded-4 shadow-sm d-inline-block"
            style="border-color: #20c997 !important; background-color: rgba(32, 201, 151, 0.05);">
            <i class="bi bi-lightbulb-fill display-6" style="color: #20c997;"></i>
          </div>
        </div>
      </div>

      <div class="row g-4">

        <div class="col-lg-7">

          <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="bg-teal-soft p-3 rounded-3 me-3" style="background-color: rgba(32, 201, 151, 0.1);">
                  <i class="bi bi-eye text-teal" style="color: #20c997; font-size: 1.5rem;"></i>
                </div>
                <h4 class="fw-bold mb-0">Shadowing & Work Visits</h4>
              </div>
              <p class="text-muted">Interested in how another team works? Shadowing is a great way to build your
                network
                and understand patient journeys across different services.</p>
              <ul class="small text-muted mb-4">
                <li>Gain insight into different clinical or administrative roles.</li>
                <li>Build stronger working relationships between departments.</li>
                <li>Identify potential career paths within the trust.</li>
              </ul>
              <div class="p-3 rounded-3 bg-light border-start border-4" style="border-color: #20c997 !important;">
                <p class="small mb-0"><strong>How to apply:</strong> Discuss your interest with your Line Manager.
                  Once
                  approved, reach out to the department lead to arrange a suitable date.</p>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
              <div class="d-flex align-items-center mb-3">
                <div class="bg-teal-soft p-3 rounded-3 me-3" style="background-color: rgba(32, 201, 151, 0.1);">
                  <i class="bi bi-people text-teal" style="color: #20c997; font-size: 1.5rem;"></i>
                </div>
                <h4 class="fw-bold mb-0">Coaching & Mentoring</h4>
              </div>
              <p class="text-muted">Unlock your potential through 1-on-1 conversations. Whether you are looking for
                career guidance or help with a specific challenge, the trust has a network of trained coaches.</p>
              <div class="row g-2">
                <div class="col-sm-6">
                  <div class="p-3 border rounded-3 h-100">
                    <h6 class="fw-bold">Coaching</h6>
                    <p class="small text-muted mb-0">Task-focused, performance-driven sessions to help you reach a
                      specific goal.</p>
                  </div>
                </div>
                <div class="col-sm-6">
                  <div class="p-3 border rounded-3 h-100">
                    <h6 class="fw-bold">Mentoring</h6>
                    <p class="small text-muted mb-0">Longer-term relationship focused on overall career growth and
                      wisdom sharing.</p>
                  </div>
                </div>
              </div>
              <a href="mailto:learninganddevelopment@rdash.nhs.uk" class="btn btn-outline-teal mt-3 rounded-pill"
                style="color: #20c997; border-color: #20c997;">Find a Coach</a>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="sticky-top" style="top: 20px;">

            <div class="card border-0 shadow-sm rounded-4 mb-4 bg-dark text-white">
              <div class="card-body p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-journal-text me-2"></i>Log Your Learning</h5>
                <p class="small opacity-75">Informal learning counts! Use the trust reflection template to record
                  your
                  shadowing or peer learning for your professional portfolio.</p>
                <hr class="opacity-25">
                <div class="mb-3">
                  <div class="fw-bold small mb-1">Peer Discussion</div>
                  <div class="progress" style="height: 5px;">
                    <div class="progress-bar" role="progressbar" style="width: 100%; background-color: #20c997;">
                    </div>
                  </div>
                </div>
                <div class="mb-4">
                  <div class="fw-bold small mb-1">Reflective Journaling</div>
                  <div class="progress" style="height: 5px;">
                    <div class="progress-bar" role="progressbar" style="width: 100%; background-color: #20c997;">
                    </div>
                  </div>
                </div>
                <a href="Assets/Reflection_Template.docx" class="btn btn-light w-100 rounded-pill fw-bold">
                  <i class="bi bi-download me-2"></i>Download Template
                </a>
              </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
              <div class="card-header bg-light fw-bold py-3">
                <i class="bi bi-link-45deg me-2"></i>Quick Resources
              </div>
              <div class="list-group list-group-flush">
                <a href="#" class="list-group-item list-group-item-action small py-3">
                  <i class="bi bi-book me-2 text-muted"></i>Journal Clubs & Research Groups
                </a>
                <a href="#" class="list-group-item list-group-item-action small py-3">
                  <i class="bi bi-briefcase me-2 text-muted"></i>Leadership Apprenticeships
                </a>
                <a href="#" class="list-group-item list-group-item-action small py-3">
                  <i class="bi bi-patch-check me-2 text-muted"></i>Professional Revalidation Support
                </a>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

<!--Modal-->
<div aria-hidden="true" class="modal fade" id="classModal" tabindex="-1">

<div class="d-flex align-items-center">

</div>

</div>

</div>
<div class="modal-body p-4">
<div id="modalDetails">
</div>
</div>
<div class="modal-footer border-0 pt-0 pb-4 px-4 justify-content-between">
<button class="btn btn-light rounded-pill px-4 text-muted fw-bold" data-bs-target="#classModal" data-bs-toggle="modal" type="button">
<i class="bi bi-x-lg me-1"></i> Close
          </button>
<a class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm" href="#" id="modalLink" style="display:none;" target="_blank">
